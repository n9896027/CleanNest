name: 功能建议
description: 提议一个明确、安全且可验证的改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和路线图。
          required: true
        - label: 我理解 AI 不会获得自动删除或命令执行权限。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述实际场景，不要只写一个功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的交互或结果
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 权限、隐私和误操作风险
      description: 说明可能读取什么、修改什么，以及如何撤销。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你尝试过的替代办法
