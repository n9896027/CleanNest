name: Bug 报告
description: 报告可复现的 CleanNest 功能或界面问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。请先移除用户名、绝对路径、文件名、令牌等隐私信息。安全漏洞请使用 Security Advisory，不要填写此表单。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
        - label: 我已从截图和日志中移除隐私信息。
          required: true
  - type: input
    id: version
    attributes:
      label: CleanNest 版本
      description: 例如 0.3.1 (Build 7)；可在设置页查看。
      placeholder: 0.3.1 (Build 7)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Mac 与 macOS
      description: 请写芯片类型、内存和 macOS 版本。
      placeholder: MacBook Pro M3 Pro, 36 GB, macOS 15.x
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: 获取方式
      options:
        - 从源码构建
        - GitHub Release
        - 其他来源
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 选择…
        3. 点击…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的技术详情或截图
      description: 可留空；不要粘贴凭据、完整主目录路径或个人文件清单。
