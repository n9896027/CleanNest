name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and self-test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Validate build script syntax
        run: |
          bash -n build.sh
          zsh -n scripts/verify-release-candidate.sh
          zsh -n scripts/verify-48h-soak-report.sh

      - name: Validate localization catalog
        run: swift Tools/LocalizationAudit.swift Resources/Localizable.xcstrings

      - name: Run unit tests with coverage
        run: swift test --enable-code-coverage

      - name: Run core self-tests
        run: swift run CleanNestSelfTest

      - name: Build and verify app bundle
        env:
          CLEANNEST_CODESIGN_IDENTITY: "-"
        run: ./build.sh release

      - name: Validate SBOM generator
        run: |
          swift Tools/SBOMGenerator.swift build/CleanNest.app build/CleanNest-ci.spdx.json
          jq empty build/CleanNest-ci.spdx.json

      - name: Validate 48-hour evidence parser with accelerated fixture
        run: |
          report="$RUNNER_TEMP/cleannest-soak-fixture.tsv"
          printf 'timestamp\tpid\trss_kb\tcpu_percent\tapp_state\talert_history_mtime\tlogin_item_state\tdisplay_count\n' > "$report"
          printf '2026-08-27T00:00:00Z\t100\t180000\t1.0\trunning\t-\tloaded\t1\n' >> "$report"
          printf '2026-08-27T00:02:00Z\t100\t181000\t1.2\trunning\t-\tloaded\t1\n' >> "$report"
          CLEANNEST_REQUIRED_SOAK_SECONDS=120 scripts/verify-48h-soak-report.sh "$report"

      - name: Smoke-test bundled read-only MCP
        run: |
          response="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{}}' | build/CleanNest.app/Contents/MacOS/CleanNestMCP)"
          test "$(printf '%s' "$response" | jq -r '.result.supportedVersions[0]')" = "2026-07-28"
          test "$(printf '%s' "$response" | jq -r '.result.capabilities.tools.listChanged')" = "false"

  compatibility:
    name: Compatibility (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            runner: macos-15
          - architecture: Intel
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain and architecture
        run: |
          swift --version
          uname -m

      - name: Run unit tests
        run: swift test

      - name: Compile release executable
        run: |
          swift build -c release --product CleanNest
          swift build -c release --product CleanNestMCP
